name: roadside_assistant
description: Road Side Assistant - Flutter + GetX + Firebase

environment:
  sdk: ">=2.18.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State + routing
  get: ^4.7.3

  # Firebase
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  cloud_firestore: ^6.0.3

  # Map & geolocation
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2

  # HTTP + urls
  http: ^1.1.0
  url_launcher: ^6.1.10

  # Utilities
  fluttertoast: ^8.2.1
  cupertino_icons: ^1.0.5
  intl: ^0.18.0
  get_storage: ^2.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  
  uses-material-design: true